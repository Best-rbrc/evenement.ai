[project]
name = "event-planner-mcp"
version = "1.0.0"
description = "MCP server for AI-powered event planning with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = "MIT"
keywords = ["mcp", "event-planning", "ai-agents", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp-sandbox-openai-sdk",
    "openai-agents[viz]>=0.4.1",
    "ortools>=9.14.6206",
    "pillow>=12.0.0",
    "pydantic>=2.12.3",
    "python-dotenv>=1.1.1",
    "reportlab>=4.4.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.29.0",
    "fastmcp>=0.3.0",
]

[project.scripts]
event-planner-mcp = "custom_mcp_servers.fastmcp_server:serve"

[tool.uv.sources]
mcp-sandbox-openai-sdk = { git = "https://github.com/GuardiAgent/python-mcp-sandbox-openai-sdk.git" }

[tool.setuptools.packages.find]
include = ["custom_mcp_servers*", "custom_agents*", "workflows*", "tools*"]
exclude = ["event_outputs*", "tests*", "__pycache__*"]

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"
